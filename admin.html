<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Portfolio admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#0B1F3A;--deep:#0F2A4D;--panel:#0d2443;--line:#1E3A63;--blue:#2F8CFF;--amber:#F5B041;--mint:#3DDC97;--red:#FF7A7A;--paper:#E8EFF9;--muted:#8FA3BF;
  --display:'Unbounded',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font:400 .95rem/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.01em;line-height:1.15}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.6rem 1rem;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--paper);font-weight:600;font-size:.9rem;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#1f78e6}
.btn.danger{color:var(--red);border-color:rgba(255,122,122,.35)}
.btn.danger:hover{background:rgba(255,122,122,.1)}
.btn.sm{padding:.35rem .65rem;font-size:.82rem;border-radius:7px}
.btn.icon{padding:.35rem .5rem;min-width:32px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:.84rem;color:var(--muted);margin-bottom:.3rem}
input,textarea,select{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--paper);font:400 .95rem var(--body);padding:.6rem .75rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.field{margin-bottom:1rem}
.hint{font-size:.8rem;color:var(--muted);margin-top:.3rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 1rem}
.check{display:flex;align-items:center;gap:.55rem;margin-bottom:1rem}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.check label{margin:0;color:var(--paper)}
.msg{border-radius:9px;padding:.6rem .85rem;font-size:.88rem;margin-bottom:1rem}
.msg.err{background:rgba(255,122,122,.1);border:1px solid rgba(255,122,122,.3);color:var(--red)}
.msg.ok{background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.3);color:var(--mint)}
.msg.info{background:rgba(47,140,255,.08);border:1px solid rgba(47,140,255,.25);color:#b9d8ff}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.lbox{width:100%;max-width:400px;background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:2rem}
.lbox h1{font-size:1.35rem;margin-bottom:.3rem}
.lbox>p{color:var(--muted);margin-bottom:1.5rem}
.lbox .btn.pri{width:100%;padding:.75rem}
.linkbtn{background:none;border:0;color:var(--blue);font-size:.88rem;margin-top:1rem;padding:0}

/* layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sb{background:var(--panel);border-right:1px solid var(--line);padding:1.3rem 1rem;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--display);font-weight:800;font-size:1rem;padding:0 .4rem}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;font-style:normal;font-size:.75rem;color:#fff}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:.78rem;color:var(--muted);padding:.9rem .7rem .3rem}
.nav a{display:flex;align-items:center;gap:.65rem;padding:.55rem .7rem;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;border-left:3px solid transparent}
.nav a:hover{color:var(--paper);background:rgba(47,140,255,.06)}
.nav a.on{color:var(--paper);background:rgba(47,140,255,.14);border-left-color:var(--blue)}
.nav a .n{margin-left:auto;font-size:.75rem;color:var(--muted);background:var(--ink);padding:0 .45rem;border-radius:6px;min-width:22px;text-align:center}
.nav a .dirty{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.nav a .dirty+.n{margin-left:.4rem}
.nav svg{width:18px;height:18px;flex-shrink:0}
.sbfoot{margin-top:auto;display:flex;flex-direction:column;gap:.5rem;font-size:.85rem}
.sbfoot .who{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .4rem}

.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;padding:1rem 1.8rem;background:rgba(11,31,58,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:1.2rem}
.top .sub{color:var(--muted);font-size:.85rem}
.top .acts{margin-left:auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
.conn{display:inline-flex;align-items:center;gap:.45rem;font-size:.82rem;color:var(--muted);text-decoration:none;padding:.35rem .6rem;border:1px solid var(--line);border-radius:999px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.conn.ok i{background:var(--mint)}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--paper);border-radius:8px;width:38px;height:38px;font-size:1.1rem}
.content{padding:1.8rem;max-width:1100px}
.card{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:1.4rem;margin-bottom:1.2rem}
.card h2{font-family:var(--body);font-size:1.05rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.bar{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:.4rem}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:1.2rem}
.stats a{background:var(--deep);padding:1.1rem 1.2rem;text-decoration:none;color:var(--paper)}
.stats a:hover{background:#12325a}
.stats b{display:block;font-family:var(--display);font-size:1.6rem}
.stats span{color:var(--muted);font-size:.85rem}

/* tables */
.tw{overflow-x:auto;margin:0 -1.4rem -1.4rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-weight:500;color:var(--muted);padding:.6rem 1.4rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.7rem 1.4rem;border-bottom:1px solid rgba(30,58,99,.6);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(47,140,255,.05)}
td .t{font-weight:600}
td .s{color:var(--muted);font-size:.82rem}
.acts-cell{display:flex;gap:.35rem;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.building{color:var(--amber)}.pill.live{color:var(--mint)}.pill.completed{color:#9cc7ff}
.star{color:var(--amber)}
.tools{display:flex;gap:.5rem;flex-wrap:wrap}
.tools input,.tools select{width:auto;min-width:170px;padding:.45rem .7rem}
.empty{padding:2rem 1.4rem;color:var(--muted);text-align:center}

/* list editors */
.rows{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.7rem}
.r{display:grid;gap:.5rem;align-items:center}
.r.stat{grid-template-columns:110px 1fr auto}
.r.svc{grid-template-columns:1fr 2fr auto}
.r.pt{grid-template-columns:1fr auto}
.r.sk{grid-template-columns:auto 52px 1.3fr 1fr 1fr 1.4fr auto;padding:.5rem;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.r input{margin:0}
.skprev{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;background:var(--ink);font-size:1.05rem}
.skprev img{width:22px;height:22px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;font-size:.65rem;width:24px;height:17px;line-height:1}
.mv button:hover{color:var(--paper)}

/* enquiries */
.enq{border-top:1px solid var(--line);padding:1rem 0}
.enq:first-child{border-top:0}
.enq.unread .t::after{content:"New";margin-left:.5rem;font-size:.72rem;background:var(--blue);color:#fff;padding:.05rem .4rem;border-radius:5px;vertical-align:2px}
.enq p{margin:.4rem 0;white-space:pre-wrap}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(5,12,25,.7);display:grid;place-items:center;z-index:100;padding:1rem}
.modal .box{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:1.5rem;max-width:420px;width:100%}
.modal h2{font-family:var(--body);font-size:1.1rem;font-weight:600;margin-bottom:.5rem}
.modal p{color:var(--muted);margin-bottom:1.2rem}
#toast{position:fixed;right:1.2rem;bottom:1.2rem;background:var(--paper);color:var(--ink);padding:.75rem 1rem;border-radius:10px;font-weight:500;z-index:200;max-width:min(420px,90vw);opacity:0;visibility:hidden;transform:translateY(10px);transition:.25s}
#toast.show{opacity:1;visibility:visible;transform:none}
#toast.err{background:#ffc2c2}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sb{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .25s}
  .sb.open{transform:none;box-shadow:0 0 0 100vmax rgba(5,12,25,.6)}
  .burger{display:block}
  .top{padding:.8rem 1rem}
  .top .sub{display:none}
  .content{padding:1rem}
  .g2,.g3{grid-template-columns:1fr}
  .r.sk{grid-template-columns:auto 44px 1fr auto}
  .r.sk .opt{grid-column:2/4}
  .r.svc{grid-template-columns:1fr auto}
  .r.svc input:nth-child(2){grid-column:1}
  .conn span{display:none}
  th,td{padding-left:.8rem;padding-right:.8rem}
  .tw{margin:0 -1.4rem -1.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lbox">
    <div id="loginForm">
      <h1>Portfolio admin</h1>
      <p>Sign in to edit your website.</p>
      <div class="msg err" id="lErr" hidden></div>
      <form onsubmit="doLogin(event)">
        <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required/></div>
        <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required/></div>
        <button class="btn pri" id="lBtn">Sign in</button>
      </form>
      <button class="linkbtn" onclick="showReset(true)">Forgot password?</button>
    </div>
    <div id="resetForm" hidden>
      <h1>Reset password</h1>
      <p>Prove you own the website with a GitHub token that can edit your portfolio repository, then choose a new password.</p>
      <div class="msg err" id="rErr" hidden></div>
      <div class="msg ok" id="rOk" hidden></div>
      <form onsubmit="doReset(event)">
        <div class="field"><label for="rToken">GitHub token</label><input id="rToken" type="password" autocomplete="off" required/><div class="hint">See <b>Publishing</b> after you sign in for how to create one.</div></div>
        <div class="field"><label for="rNew">New password</label><input id="rNew" type="password" autocomplete="new-password" minlength="8" required/></div>
        <div class="field"><label for="rConf">Repeat new password</label><input id="rConf" type="password" autocomplete="new-password" required/></div>
        <button class="btn pri" id="rBtn">Reset password</button>
      </form>
      <button class="linkbtn" onclick="showReset(false)">Back to sign in</button>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" hidden>
  <aside class="sb" id="sb">
    <div class="brand"><i>AV</i>Portfolio admin</div>
    <nav class="nav" id="nav" aria-label="Admin sections"></nav>
    <div class="sbfoot">
      <a class="btn sm" href="index.html" target="_blank" rel="noopener">View website</a>
      <button class="btn sm" onclick="logout()">Sign out</button>
      <div class="who" id="who"></div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Open menu">☰</button>
      <div><h1 id="pTitle">Dashboard</h1><div class="sub" id="pSub"></div></div>
      <div class="acts">
        <a class="conn" id="conn" href="#publishing"><i></i><span>Not connected</span></a>
        <button class="btn pri" id="pubAll" onclick="publishAll()" hidden>Publish all changes</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle"></h2><p id="mText"></p><div class="bar"><button class="btn" id="mNo">Cancel</button><button class="btn danger" id="mYes">Delete</button></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ═════════ helpers ═════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FILES={profile:'profile.json',skills:'skills.json',projects:'projects.json',experience:'experience.json',education:'education.json',certificates:'certificates.json'};
const SESS='av_admin_session', GHK='av_admin_github', ENQ_KEY='av_enquiries';
let DB={}, ORIG={}, AUTH=null, DIRTY=new Set(), PAGE='dashboard', EDIT=null;

function toast(m,err){const t=$('toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',err?6000:3500)}
function confirmBox(title,text,yes='Delete'){return new Promise(res=>{$('mTitle').textContent=title;$('mText').textContent=text;$('mYes').textContent=yes;$('modal').hidden=false;$('mYes').focus();
  const done=v=>{$('modal').hidden=true;res(v)};$('mYes').onclick=()=>done(true);$('mNo').onclick=()=>done(false);$('modal').onclick=e=>{if(e.target.id==='modal')done(false)}})}
const nextId=a=>a.reduce((m,x)=>Math.max(m,+x.id||0),0)+1;
const byOrder=a=>a.sort((x,y)=>(x.order||999)-(y.order||999));
const renumber=a=>a.forEach((x,i)=>x.order=i+1);
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const randSalt=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function fetchJSON(f){const r=await fetch('data/'+f+'?t='+Date.now());if(!r.ok)throw new Error(f+' '+r.status);return r.json()}
const ICON={
 dashboard:'<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>',
 profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 skills:'<path d="m13 2-9 12h7l-1 8 9-12h-7z"/>',
 projects:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 experience:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
 education:'<path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
 certificates:'<circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"/>',
 messages:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
 publishing:'<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 15v4h14v-4"/>',
 account:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'};
const svg=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>';
const PAGES={
 dashboard:{t:'Dashboard',s:'What\'s on your website right now'},
 profile:{t:'Profile',s:'Your name, role, intro, services and contact details',file:'profile'},
 skills:{t:'Tech stack',s:'Technologies shown in the Tech stack section',file:'skills'},
 projects:{t:'Projects',s:'Everything listed in the Projects section',file:'projects'},
 experience:{t:'Experience',s:'Jobs shown on the timeline',file:'experience'},
 education:{t:'Education',s:'Degrees shown under Experience',file:'education'},
 certificates:{t:'Certifications',s:'Courses and certificates shown under Education',file:'certificates'},
 messages:{t:'Messages',s:'Enquiries sent from the contact form'},
 publishing:{t:'Publishing',s:'Connect GitHub so changes go live without uploading files'},
 account:{t:'Password',s:'Change the admin password'}};

/* ═════════ GitHub publishing ═════════ */
function gh(){try{return JSON.parse(localStorage.getItem(GHK)||'null')}catch(e){return null}}
function ghDefaults(){const h=location.hostname, onPages=h.endsWith('.github.io');
  return {owner:onPages?h.split('.')[0]:'AshishVDeveloper',repo:onPages&&location.pathname.split('/').filter(Boolean)[0]||'portfolio',branch:'main'}}
async function ghApi(cfg,path,opt={}){
  const r=await fetch('https://api.github.com/repos/'+cfg.owner+'/'+cfg.repo+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+cfg.token,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.message||('GitHub error '+r.status));e.status=r.status;throw e}
  return j}
const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
async function ghPut(cfg,file,data,msg){
  const path='/contents/data/'+file; let sha;
  try{sha=(await ghApi(cfg,path+'?ref='+encodeURIComponent(cfg.branch))).sha}catch(e){if(e.status!==404)throw e}
  return ghApi(cfg,path,{method:'PUT',body:JSON.stringify({message:msg,content:b64(JSON.stringify(data,null,2)+'\n'),branch:cfg.branch,...(sha?{sha}:{})})})}
async function ghCheck(cfg){const r=await ghApi(cfg,'');if(!r.permissions||!r.permissions.push)throw new Error('This token can read the repository but can\'t change it. Give it "Contents: Read and write" access.');return r}
function errText(e){if(e.status===401)return'GitHub rejected the token. It may have expired — create a new one in Publishing.';if(e.status===404)return'Repository not found, or the token has no access to it. Check the repository name in Publishing.';if(e.status===409)return'The file changed on GitHub at the same time. Publish again.';return e.message||'Something went wrong.'}

function download(file,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}));a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}

async function publish(key,btn){
  const file=key==='auth'?'auth.json':FILES[key], data=key==='auth'?AUTH:DB[key], cfg=gh();
  if(!cfg||!cfg.token){download(file,data);markClean(key);toast('Downloaded '+file+'. Upload it to the data folder on GitHub, or connect GitHub in Publishing to skip this step.');return true}
  const label=btn&&btn.innerHTML; if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>Publishing…'}
  try{await ghPut(cfg,file,data,'Update '+file+' from admin panel');markClean(key);toast('Published. Your website updates in about a minute.');return true}
  catch(e){toast(errText(e),true);return false}
  finally{if(btn){btn.disabled=false;btn.innerHTML=label}}
}
async function publishAll(){const b=$('pubAll');for(const k of [...DIRTY]){if(!await publish(k,b))return}}
function markDirty(k){DIRTY.add(k);updateChrome()}
function markClean(k){if(k==='auth')return;DIRTY.delete(k);ORIG[k]=JSON.stringify(DB[k]);updateChrome()}
window.addEventListener('beforeunload',e=>{if(DIRTY.size){e.preventDefault();e.returnValue=''}});

/* ═════════ auth ═════════ */
async function loadAuth(){AUTH=await fetchJSON('auth.json')}
async function checkPass(email,pass){
  if(!AUTH||email.trim().toLowerCase()!==String(AUTH.email).toLowerCase())return false;
  if(AUTH.password_sha256)return await sha256(AUTH.salt+'|'+email.trim().toLowerCase()+'|'+pass)===AUTH.password_sha256;
  if(AUTH.password_md5)return md5(email.trim()+'|'+pass)===AUTH.password_md5;
  return false}
async function newAuth(pass){const salt=randSalt(), email=String(AUTH.email).toLowerCase();return {email:AUTH.email,salt,password_sha256:await sha256(salt+'|'+email+'|'+pass)}}
async function doLogin(e){
  e.preventDefault(); const b=$('lBtn'); b.disabled=true; $('lErr').hidden=true;
  try{if(!AUTH)await loadAuth();

async function openApp(){

function route(){

  const c=gh(); $('conn').className='conn'+(c&&c.token?' ok':''); $('conn').querySelector('span').textContent=c&&c.token?'Publishing to GitHub':'Not connected';

function drawEdu(){const A=DB.education;$('dRows').innerHTML=A.map((x,i)=>'<tr><td style="width:40px"><div class="mv"><button aria-label="Move up" onclick="mv(\'education\','+i+',-1,drawEdu)">▲</button><button aria-label="Move down" onclick="mv(\'education\','+i+',1,drawEdu)">▼</button></div></td><td><div class="t">'+esc(x.degree)+'</div><div class="s">'+esc(x.college)+(x.year?' · '+esc(x.year):'')+'</div></td><td><div class="acts-cell"><a class="btn sm" href="#education/'+x.id+'">Edit</a><button class="btn sm danger" onclick="delItem(\'education\','+i+',drawEdu)">Delete</button></div></td></tr>').join('')||'<tr><td class="empty">No degrees yet.</td></tr>'}
function pgEduForm(id){
  const isNew=id==='new', x=isNew?{degree:'',college:'',university:'',year:'',icon:'🎓'}:DB.education.find(e=>String(e.id)===id);
  if(!x){location.hash='education';return}
  $('pTitle').textContent=isNew?'Add degree':'Edit degree';
  C('<div class="card"><form onsubmit="saveEdu(event,\''+id+'\')"><div class="field"><label for="d_deg">Degree</label><input id="d_deg" required value="'+esc(x.degree)+'"/></div><div class="g2"><div class="field"><label for="d_col">College</label><input id="d_col" required value="'+esc(x.college)+'"/></div><div class="field"><label for="d_uni">University</label><input id="d_uni" value="'+esc(x.university)+'"/></div><div class="field"><label for="d_year">Year</label><input id="d_year" value="'+esc(x.year)+'" placeholder="2020 or Completed"/></div></div><div class="bar"><a class="btn" href="#education">Cancel</a><button class="btn pri">'+(isNew?'Add degree':'Save degree')+'</button></div></form></div>')}
function saveEdu(e,id){e.preventDefault();const v=k=>$(k).value.trim();const data={degree:v('d_deg'),college:v('d_col'),university:v('d_uni'),year:v('d_year')};
  if(id==='new'){DB.education.push({id:nextId(DB.education),order:DB.education.length+1,icon:'🎓',...data})}else Object.assign(DB.education.find(x=>String(x.id)===id),data);
  markDirty('education');toast('Degree saved. Publish to show it on your website.');location.hash='education'}

/* ═════════ certifications ═════════ */
function pgCerts(){C('<div class="card"><h2>Certificates <a class="btn sm pri" href="#certificates/new">Add certificate</a></h2><div class="tw"><table><tbody id="cRows"></tbody></table></div></div>'+saveBar('certificates'));drawCerts()}
function drawCerts(){const A=DB.certificates;$('cRows').innerHTML=A.map((x,i)=>'<tr><td style="width:40px"><div class="mv"><button aria-label="Move up" onclick="mv(\'certificates\','+i+',-1,drawCerts)">▲</button><button aria-label="Move down" onclick="mv(\'certificates\','+i+',1,drawCerts)">▼</button></div></td><td><div class="t">'+esc(x.title)+'</div><div class="s">'+esc(x.issuer)+(x.year?' · '+esc(x.year):'')+(x.url?' · <a href="'+esc(x.url)+'" target="_blank" rel="noopener">certificate</a>':'')+'</div></td><td><div class="acts-cell"><a class="btn sm" href="#certificates/'+x.id+'">Edit</a><button class="btn sm danger" onclick="delItem(\'certificates\','+i+',drawCerts)">Delete</button></div></td></tr>').join('')||'<tr><td class="empty">No certificates yet.</td></tr>'}
function pgCertForm(id){
  const isNew=id==='new', x=isNew?{title:'',issuer:'NPTEL',year:'',url:''}:DB.certificates.find(e=>String(e.id)===id);
  if(!x){location.hash='certificates';return}
  $('pTitle').textContent=isNew?'Add certificate':'Edit certificate';
  C('<div class="card"><form onsubmit="saveCert(event,\''+id+'\')"><div class="field"><label for="c_title">Course or certificate</label><input id="c_title" required value="'+esc(x.title)+'" placeholder="e.g. Ethical Hacking"/></div><div class="g2"><div class="field"><label for="c_issuer">Issued by</label><input id="c_issuer" required value="'+esc(x.issuer)+'" placeholder="e.g. NPTEL"/></div><div class="field"><label for="c_year">Year or score</label><input id="c_year" value="'+esc(x.year)+'" placeholder="e.g. 2023 · Elite"/></div></div><div class="field"><label for="c_url">Certificate link</label><input id="c_url" type="url" value="'+esc(x.url)+'" placeholder="https://"/><div class="hint">Optional. Paste the verification link so visitors can open the certificate.</div></div><div class="bar"><a class="btn" href="#certificates">Cancel</a><button class="btn pri">'+(isNew?'Add certificate':'Save certificate')+'</button></div></form></div>')}
function saveCert(e,id){e.preventDefault();const v=k=>$(k).value.trim();const data={title:v('c_title'),issuer:v('c_issuer'),year:v('c_year'),url:v('c_url')};
  if(id==='new')DB.certificates.push({id:nextId(DB.certificates),order:DB.certificates.length+1,...data});else Object.assign(DB.certificates.find(x=>String(x.id)===id),data);
  markDirty('certificates');toast('Certificate saved. Publish to show it on your website.');location.hash='certificates'}

/* ═════════ messages ═════════ */
function enqs(){try{return JSON.parse(localStorage.getItem(ENQ_KEY)||'[]')}catch(e){return[]}}
function setEnqs(a){localStorage.setItem(ENQ_KEY,JSON.stringify(a));updateChrome()}
function pgMessages(){
  const A=enqs(), email=DB.profile.email;
  C('<div class="msg info">Every message from the contact form is emailed to <b>'+esc(email)+'</b>. The first time someone sends one, FormSubmit emails you a one-time <b>Activate</b> link — click it, or messages won\'t be delivered. <a href="https://mail.google.com/mail/u/0/#search/from%3Aformsubmit" target="_blank" rel="noopener">Open in Gmail</a></div>'+
   '<div class="card"><h2>Sent from this browser ('+A.length+')'+(A.length?'<button class="btn sm danger" onclick="clearEnq()">Clear all</button>':'')+'</h2><p class="hint" style="margin:-.5rem 0 .6rem">Copies are only kept on the device where the form was sent — use these to test the form.</p>'+
   (A.length?A.map((x,i)=>'<div class="enq'+(x.read?'':' unread')+'"><div class="t">'+esc(x.name)+' — '+esc(x.subject)+'</div><div class="s">'+esc(x.email)+(x.phone?' · '+esc(x.phone):'')+' · '+esc(x.date)+' · '+(x.email_sent?'emailed':'<span style="color:var(--red)">email failed</span>')+'</div><p>'+esc(x.message)+'</p><div class="bar" style="justify-content:flex-start"><a class="btn sm" href="mailto:'+esc(x.email)+'?subject='+encodeURIComponent('Re: '+x.subject)+'">Reply</a>'+(x.read?'':'<button class="btn sm" onclick="readEnq('+i+')">Mark as read</button>')+'<button class="btn sm danger" onclick="delEnq('+i+')">Delete</button></div></div>').join(''):'<p class="empty">No messages on this browser.</p>')+'</div>')}
function readEnq(i){const a=enqs();a[i].read=true;setEnqs(a);pgMessages()}
async function delEnq(i){if(!await confirmBox('Delete this message?','It is removed from this browser only.'))return;const a=enqs();a.splice(i,1);setEnqs(a);pgMessages()}
async function clearEnq(){if(!await confirmBox('Delete all messages?','They are removed from this browser only.'))return;setEnqs([]);pgMessages()}

/* ═════════ publishing ═════════ */
function pgPublishing(){
  const c={...ghDefaults(),...(gh()||{})};
  C('<div class="card"><h2>Connect GitHub</h2>'+(c.token?'<div class="msg ok">Connected. Publish buttons update <b>'+esc(c.owner+'/'+c.repo)+'</b> directly.</div>':'')+
   '<ol style="margin:0 0 1.2rem 1.2rem;color:var(--muted)"><li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → New fine-grained token</a>.</li><li>Name it "Portfolio admin", pick an expiry, and under <b>Repository access</b> choose <b>Only select repositories → '+esc(c.repo)+'</b>.</li><li>Under <b>Permissions → Contents</b>, choose <b>Read and write</b>. Click <b>Generate token</b> and paste it below.</li></ol>'+
   '<form onsubmit="saveGh(event)"><div class="g3"><div class="field"><label for="g_owner">GitHub username</label><input id="g_owner" required value="'+esc(c.owner)+'"/></div><div class="field"><label for="g_repo">Repository</label><input id="g_repo" required value="'+esc(c.repo)+'"/></div><div class="field"><label for="g_branch">Branch</label><input id="g_branch" required value="'+esc(c.branch)+'"/></div></div>'+
   '<div class="field"><label for="g_token">Token</label><input id="g_token" type="password" autocomplete="off" placeholder="'+(c.token?'Saved — paste a new one to replace it':'github_pat_…')+'"/><div class="hint">The token is stored only in this browser. Anyone using this browser could publish to your site, so sign out on shared computers.</div></div>'+
   '<div class="bar">'+(c.token?'<button type="button" class="btn danger" onclick="disconnectGh()">Disconnect</button>':'')+'<button class="btn pri" id="gBtn">'+(c.token?'Save and test':'Connect')+'</button></div></form></div>')}
async function saveGh(e){
  e.preventDefault(); const old=gh()||{}, cfg={owner:$('g_owner').value.trim(),repo:$('g_repo').value.trim(),branch:$('g_branch').value.trim(),token:$('g_token').value.trim()||old.token};
  if(!cfg.token){toast('Paste a token first.',true);return}
  const b=$('gBtn');b.disabled=true;b.textContent='Testing…';
  try{await ghCheck(cfg);localStorage.setItem(GHK,JSON.stringify(cfg));toast('GitHub connected. Publish buttons now update your website.');pgPublishing();updateChrome()}
  catch(err){toast(errText(err),true);b.disabled=false;b.textContent='Connect'}}
async function disconnectGh(){if(!await confirmBox('Disconnect GitHub?','Publish buttons will download files instead.','Disconnect'))return;localStorage.removeItem(GHK);pgPublishing();updateChrome()}

/* ═════════ account ═════════ */
function pgAccount(){
  C('<div class="card" style="max-width:480px"><h2>Change password</h2><div class="msg err" id="aErr" hidden></div><form onsubmit="changePw(event)"><input type="text" autocomplete="username" value="'+esc(AUTH.email)+'" hidden/>'+
   '<div class="field"><label for="a_cur">Current password</label><input id="a_cur" type="password" autocomplete="current-password" required/></div>'+
   '<div class="field"><label for="a_new">New password</label><input id="a_new" type="password" autocomplete="new-password" minlength="8" required/><div class="hint">At least 8 characters.</div></div>'+
   '<div class="field"><label for="a_conf">Repeat new password</label><input id="a_conf" type="password" autocomplete="new-password" required/></div>'+
   '<div class="bar"><button class="btn pri" id="aBtn">Change password</button></div></form></div>')}
async function changePw(e){
  e.preventDefault(); const err=m=>{$('aErr').textContent=m;$('aErr').hidden=false}; $('aErr').hidden=true;
  if(!await checkPass(AUTH.email,$('a_cur').value))return err('Current password is incorrect.');
  if($('a_new').value!==$('a_conf').value)return err('The two new passwords don\'t match.');
  const prev=AUTH; AUTH=await newAuth($('a_new').value);
  if(await publish('auth',$('aBtn'))){e.target.reset();toast(gh()?'Password changed. It works in about a minute.':'Downloaded auth.json. Upload it to the data folder to activate the new password.')}else AUTH=prev}

(async()=>{try{await loadAuth()}catch(e){}
  const s=sessionStorage.getItem(SESS); if(s&&AUTH&&JSON.parse(s).email===AUTH.email)openApp(); else $('lEmail').focus()})();
